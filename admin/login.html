<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Authentication | J Raghavendra Portfolio Console</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="blueprint-background" aria-hidden="true"></div>

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <div class="admin-login-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>OWNER ACCESS GATEWAY</span>
        </div>
        <h1 style="font-size: var(--text-xl); font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 6px;">Portfolio Control Center</h1>
        <p style="font-size: var(--text-xs); color: var(--text-tertiary);">Sign in with owner credentials to manage portfolio content, inspect telemetry, and review private recruiter inquiries.</p>
      </div>

      <!-- Error / Lockout Banner -->
      <div id="login-error-banner" style="display: none; padding: 10px 14px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-md); color: #ef4444; font-size: 13px; margin-bottom: 1.25rem; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="login-error-text"></span>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="admin-form-group">
          <label for="login-email" class="admin-form-label">
            <span>Owner Email</span>
          </label>
          <input type="email" id="login-email" class="admin-form-input" placeholder="raghavendraraghu71537@gmail.com" required autocomplete="username" autofocus>
        </div>

        <div class="admin-form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="login-password" class="admin-form-label" style="margin-bottom: 0;">Password</label>
            <button type="button" id="toggle-pwd-btn" style="background: none; border: none; font-size: 11px; color: var(--accent-primary); cursor: pointer; font-family: var(--font-mono);">Show</button>
          </div>
          <input type="password" id="login-password" class="admin-form-input" placeholder="••••••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; justify-content: center; height: 42px;">
          <span id="login-btn-text">Authenticate as Owner</span>
          <svg id="login-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
        <a href="/" style="font-size: var(--text-xs); color: var(--text-tertiary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
          <span>← Back to Public Portfolio</span>
        </a>
      </div>
    </div>
  </div>

  <script src="/js/admin-login.js"></script>
</body>
</html>
